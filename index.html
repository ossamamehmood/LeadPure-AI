<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LeadPure AI V17: Serverless email verification for single addresses and lists up to 5,000 leads." />

  </head>
  <body>
    <script>
      // Suppress Vite HMR WebSocket noise in embedded preview panes
      window.addEventListener('unhandledrejection', (event) => {
        if (event.reason && (
          String(event.reason).includes('WebSocket') ||
          (event.reason.message && String(event.reason.message).includes('WebSocket'))
        )) {
          event.preventDefault();
        }
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
