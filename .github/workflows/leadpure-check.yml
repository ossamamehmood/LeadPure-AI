name: leadpure-check
run-name: "leadpure-check ${{ inputs.request_id }}${{ inputs.chunk_index != '' && format(' chunk-{0}', inputs.chunk_index) || '' }}"

# LeadPure OWN engine: verifies emails on a GitHub Actions runner with Port 25 open.
# GitHub schedules ubuntu-latest across Azure (Port 25 open) and AWS (Port 25 blocked).
# Fast Port-25 check before running probe skips AWS nodes in <4s and retries on a
# fresh runner VM until an open-port-25 node is assigned.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique request id (sanitized)'
        required: true
        type: string
      chunk_index:
        description: 'Optional chunk index (0..N) for bulk runs'
        required: false
        default: ''
        type: string
      emails:
        description: 'Emails to verify, one per line'
        required: true
        type: string
      is_recheck:
        description: 'True when dispatched by automatic UNKNOWN re-check queue'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  probe_1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.p25.outputs.ok }}
    steps:
      - name: Check Port 25 egress
        id: p25
        continue-on-error: true
        run: |
          if nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Probe and publish results
        if: steps.p25.outputs.ok == 'true'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          IS_RECHECK: ${{ inputs.is_recheck }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_2:
    needs: probe_1
    if: ${{ !cancelled() && (needs.probe_1.result == 'failure' || needs.probe_1.outputs.ok == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.p25.outputs.ok }}
    steps:
      - name: Check Port 25 egress (Retry 1)
        id: p25
        continue-on-error: true
        run: |
          if nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Probe and publish results
        if: steps.p25.outputs.ok == 'true'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          IS_RECHECK: ${{ inputs.is_recheck }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_3:
    needs: probe_2
    if: ${{ !cancelled() && (needs.probe_2.result == 'failure' || needs.probe_2.outputs.ok == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ok: ${{ steps.p25.outputs.ok }}
    steps:
      - name: Check Port 25 egress (Retry 2)
        id: p25
        continue-on-error: true
        run: |
          if nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - uses: actions/checkout@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          ref: main
      - uses: actions/setup-node@v4
        if: steps.p25.outputs.ok == 'true'
        with:
          node-version: '22'
      - name: Probe and publish results
        if: steps.p25.outputs.ok == 'true'
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          IS_RECHECK: ${{ inputs.is_recheck }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_fallback:
    needs: probe_3
    if: ${{ !cancelled() && (needs.probe_3.result == 'failure' || needs.probe_3.outputs.ok == 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe and publish results (Fallback)
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          IS_RECHECK: ${{ inputs.is_recheck }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh
