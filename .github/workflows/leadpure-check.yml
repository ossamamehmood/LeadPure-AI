name: leadpure-check

# LeadPure OWN engine — runs probe.mjs (LeadPure's own SMTP probe) on a GitHub
# Actions runner (outbound port 25 open) and commits the raw result JSON to
# the `results` branch of THIS repo. No Reacher, no external verify repo.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique request id (result file name)'
        required: true
        type: string
      emails:
        description: 'Emails to verify, one per line'
        required: true
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force IPv4 (avoid IPv6 SMTP drops)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true

      - name: Write email list
        run: |
          printf '%s\n' "${{ inputs.emails }}" > emails.txt
          wc -l emails.txt

      - name: Run LeadPure probe
        run: node engine/probe.mjs emails.txt result.json

      - name: Publish result to results branch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          git config user.name "leadpure-engine"
          git config user.email "engine@leadpure.ai"
          # Fetch or create the results branch in a scratch clone of this repo
          cd "$RUNNER_TEMP"
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          cd pub
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git checkout --quiet results
          else
            git checkout --quiet --orphan results
            git rm -rf . >/dev/null 2>&1 || true
            echo "# LeadPure verification results" > README.md
            git add README.md
            git commit --quiet -m "init results branch"
          fi
          mkdir -p results
          cp "$GITHUB_WORKSPACE/result.json" "results/${REQUEST_ID}.json"
          git add "results/${REQUEST_ID}.json"
          git commit --quiet -m "result ${REQUEST_ID}"
          git push --quiet origin results
          echo "Published results/${REQUEST_ID}.json"
