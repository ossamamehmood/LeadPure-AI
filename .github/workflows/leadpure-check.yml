name: leadpure-check

# LeadPure OWN engine — verifies emails on a GitHub Actions runner with Port 25 open.
# GitHub schedules ubuntu-latest across Azure (Port 25 open) and AWS (Port 25 blocked).
# Fast Port-25 check before running probe fails AWS nodes in <4s and immediately retries
# on a fresh runner VM until an open-port-25 node is assigned.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique request id (sanitized)'
        required: true
        type: string
      chunk_index:
        description: 'Optional chunk index (0..N) for bulk runs'
        required: false
        default: ''
        type: string
      emails:
        description: 'Emails to verify, one per line'
        required: true
        type: string

permissions:
  contents: write

jobs:
  probe_1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Port 25 egress
        run: nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe and publish results
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_2:
    needs: probe_1
    if: needs.probe_1.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Port 25 egress (Retry 1)
        run: nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe and publish results
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_3:
    needs: probe_2
    if: needs.probe_2.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check Port 25 egress (Retry 2)
        run: nc -4 -z -w 4 gmail-smtp-in.l.google.com 25 || nc -4 -z -w 4 alt1.gmail-smtp-in.l.google.com 25
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe and publish results
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh

  probe_fallback:
    needs: probe_3
    if: needs.probe_3.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Probe and publish results (Fallback)
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
          EMAILS_INPUT: ${{ inputs.emails }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash engine/run-ci-probe.sh
