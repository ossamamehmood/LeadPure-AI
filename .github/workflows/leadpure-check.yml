name: leadpure-check

# LeadPure OWN engine — runs probe.mjs (LeadPure's own SMTP probe) on a GitHub
# Actions runner (outbound port 25 open) and commits the raw result JSON to
# the `results` branch of THIS repo. Supports single-email checks and chunked bulk runs.

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique request id (sanitized)'
        required: true
        type: string
      chunk_index:
        description: 'Optional chunk index (0..N) for bulk runs'
        required: false
        default: ''
        type: string
      emails:
        description: 'Emails to verify, one per line'
        required: true
        type: string

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force IPv4 (avoid IPv6 SMTP drops)
        run: sudo sysctl -w net.ipv6.conf.all.disable_ipv6=1 || true

      - name: Write email list safely
        env:
          EMAILS_INPUT: ${{ inputs.emails }}
        run: |
          printf '%s\n' "$EMAILS_INPUT" > emails.txt
          wc -l emails.txt

      - name: Run LeadPure probe
        run: node engine/probe.mjs emails.txt result.json

      - name: Publish result to results branch
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          CHUNK_INDEX: ${{ inputs.chunk_index }}
        run: |
          if ! [[ "$REQUEST_ID" =~ ^[a-zA-Z0-9_-]+$ ]]; then
            echo "Invalid request_id" >&2
            exit 1
          fi
          if [ -n "$CHUNK_INDEX" ] && ! [[ "$CHUNK_INDEX" =~ ^[0-9]+$ ]]; then
            echo "Invalid chunk_index" >&2
            exit 1
          fi

          git config --global user.name "leadpure-engine"
          git config --global user.email "engine@leadpure.ai"

          cd "$RUNNER_TEMP"
          git clone --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" pub
          cd pub
          if git ls-remote --exit-code --heads origin results >/dev/null 2>&1; then
            git checkout --quiet results
          else
            git checkout --quiet --orphan results
            git rm -rf . >/dev/null 2>&1 || true
            echo "# LeadPure verification results" > README.md
            git add README.md
            git commit --quiet -m "init results branch"
          fi

          mkdir -p results
          if [ ! -f vercel.json ]; then
            echo '{"ignoreCommand":"exit 0"}' > vercel.json
            git add vercel.json
          fi

          if [ -n "$CHUNK_INDEX" ]; then
            TARGET_PATH="results/${REQUEST_ID}/chunk-${CHUNK_INDEX}.json"
            mkdir -p "results/${REQUEST_ID}"
          else
            TARGET_PATH="results/${REQUEST_ID}.json"
          fi

          cp "$GITHUB_WORKSPACE/result.json" "$TARGET_PATH"
          git add "$TARGET_PATH"
          git commit --quiet -m "result ${REQUEST_ID}${CHUNK_INDEX:+ chunk-${CHUNK_INDEX}}"

          for attempt in 1 2 3 4 5; do
            git pull --rebase --quiet origin results || true
            if git push --quiet origin results; then
              echo "Published $TARGET_PATH"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Failed to push results" >&2
          exit 1
